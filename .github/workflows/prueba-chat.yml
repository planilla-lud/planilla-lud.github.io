name: Probar el chat (temporal)
on:
  push:
    branches: [prueba-chat7]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          U=$(jq -r .url chat-config.json)
          while IFS= read -r b; do
            echo "### $(echo "$b" | jq -r '.mensajes[-1].texto')" >> tmp/respuestas.md
            curl -s -X POST "$U/chat" -H "Origin: https://planilla-lud.github.io" -H "Content-Type: application/json" --data "$b" >> tmp/respuestas.md
            printf "\n\n" >> tmp/respuestas.md
          done < tmp/cuerpos.jsonl
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f tmp/respuestas.md && git commit -qm respuestas && git push
