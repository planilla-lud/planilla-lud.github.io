name: Probar en vivo (temporal)
on:
  push:
    branches: [prueba-vivo]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          U=$(jq -r .url chat-config.json)
          for d in sub20-a mayores-a reserva-c; do
            echo "### $d" >> tmp/vivo.txt
            curl -s "$U/vivo?div=$d" -H "Origin: https://planilla-lud.github.io" | jq -c '{consultado, n: (.partidos|length), ultimos: (.partidos|sort_by(.dia)|.[-3:]|map("\(.dia) \(.local) \(.gl)-\(.gv) \(.visitante)")), tablas: (.tablas|keys), error, detalle}' >> tmp/vivo.txt
          done
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f tmp/vivo.txt && git commit -qm vivo && git push
