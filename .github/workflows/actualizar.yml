name: Actualizar planillas y bajas

on:
  schedule:
    # Horario en UTC (Uruguay = UTC-3): domingo 18:35 y lunes a jueves 20:35 en Montevideo,
    # para agarrar las planillas que la Liga carga tarde; y jueves 22:35, después de que la Liga
    # publica los fallos (jueves 21 h).
    - cron: '35 21 * * 0'
    - cron: '35 23 * * 1-4'
    - cron: '35 1 * * 5'
    # Fin de semana, cada una hora de 14:05 a 03:05 (sábado y domingo): carga los partidos del día apenas la
    # Liga los publica. Si no falta nada (scripts/faltan.mjs), la corrida termina enseguida.
    - cron: '5 17-23 * * 0,6'
    - cron: '5 0-6 * * 0,1'
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/actualizar.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ¿Falta cargar algún partido?
        id: faltan
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '5 ')
        run: node scripts/faltan.mjs
      # Ojo: en GitHub '' == '0' da verdadero (compara como números), por eso se mira 'outcome' y se compara con '1'.
      - run: node scripts/detalle.mjs
        if: steps.faltan.outcome == 'skipped' || steps.faltan.outputs.seguir == '1'
        env:
          MAX_MIN: '120'
          SOLO_FALTANTES: ${{ steps.faltan.outputs.seguir == '1' && '1' || '' }}
      - run: node scripts/sanciones.mjs
        if: steps.faltan.outcome == 'skipped' || steps.faltan.outputs.seguir == '1'
      - run: node scripts/analizar.mjs
        if: steps.faltan.outcome == 'skipped' || steps.faltan.outputs.seguir == '1'
      - run: node scripts/chat.mjs
        if: steps.faltan.outcome == 'skipped' || steps.faltan.outputs.seguir == '1'
      - name: Guardar datos
        if: always() && (steps.faltan.outcome == 'skipped' || steps.faltan.outputs.seguir == '1')
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add planillas data
          # Si mientras corría alguien subió cambios (código o web), se traen antes de guardar.
          git diff --cached --quiet || { git commit -m "Planillas y bajas actualizadas" && for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 10; done; }
