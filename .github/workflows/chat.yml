name: Publicar el chat
# Publica el servidor del chat (worker/) en Cloudflare y guarda su dirección en chat-config.json, que es
# lo que lee la página para mostrar el botón "Preguntale". Necesita los secretos CLOUDFLARE_API_TOKEN y
# CLOUDFLARE_ACCOUNT_ID; GEMINI_KEY y GROQ_KEY son opcionales (respaldo cuando se acaba la cuota del día).
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/chat.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chat
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: ¿Están las claves de Cloudflare?
        id: claves
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CUENTA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID: el chat no se publica."; fi
      - name: Espacio para los resultados provisorios (Cloudflare KV)
        if: steps.claves.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          buscar() { npx -y wrangler@3 kv namespace list 2>/dev/null | jq -r '.[] | select(.title | test("planilla-lud-provisorios")) | .id' | head -1; }
          ID=$(buscar)
          if [ -z "$ID" ]; then npx -y wrangler@3 kv namespace create planilla-lud-provisorios >/dev/null; ID=$(buscar); fi
          if [ -z "$ID" ]; then echo "::error::No se pudo crear el espacio KV (¿el token tiene permiso de Workers KV Storage?)"; exit 1; fi
          sed -i "s/__KV_ID__/$ID/" worker/wrangler.toml
      - name: Publicar en Cloudflare
        id: deploy
        if: steps.claves.outputs.ok == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Claves (Gemini, Groq y la de los provisorios)
        if: steps.claves.outputs.ok == '1'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          ADMIN_CLAVE: ${{ secrets.ADMIN_CLAVE }}
        run: |
          [ -n "$ADMIN_CLAVE" ] && echo "$ADMIN_CLAVE" | npx -y wrangler@3 secret put ADMIN_CLAVE || true
          [ -n "$GEMINI_KEY" ] && echo "$GEMINI_KEY" | npx -y wrangler@3 secret put GEMINI_KEY || true
          [ -n "$GROQ_KEY" ] && echo "$GROQ_KEY" | npx -y wrangler@3 secret put GROQ_KEY || true
      - name: Guardar la dirección del chat
        if: steps.claves.outputs.ok == '1'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then echo "::error::No se obtuvo la dirección del worker"; exit 1; fi
          echo "{\"url\":\"$URL\"}" > chat-config.json
          curl -s "$URL" || true
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add chat-config.json
          git diff --cached --quiet || { git commit -m "Dirección del chat" && for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 10; done; }
