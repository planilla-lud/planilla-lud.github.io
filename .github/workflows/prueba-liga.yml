name: Consultar Liga (temporal)
on:
  push:
    branches: [prueba-liga]
permissions:
  contents: write
jobs:
  l:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node tmp/liga.mjs
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f tmp/liga.txt && git commit -qm liga && git push
