<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planilla LUD se mudó</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://planilla-lud.vercel.app/">
<meta name="theme-color" content="#000000">
<!-- Planilla LUD ahora vive en https://planilla-lud.vercel.app/ (la web gratis y Para clubes juntas). Esta página solo redirige, conservando la
     sección que se pidió (el #/... de la dirección), para que no se rompan los links viejos ni las apps
     instaladas con la dirección anterior. Cada dirección tiene su propia memoria del navegador: lo que la
     persona tenía guardado acá (Mi equipo, el voto del contador...) viaja en ?migrar= y la app nueva lo
     guarda. -->
<script>
  var q = location.search;
  try {
    var datos = {};
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); datos[k] = localStorage.getItem(k); }
    if (Object.keys(datos).length) q = (q ? q + '&' : '?') + 'migrar=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(datos)))));
  } catch (e) {}
  location.replace('https://planilla-lud.vercel.app/' + q + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://planilla-lud.vercel.app/"></noscript>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#f3f3f4;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
  a{color:#7cc4ff}
</style>
</head>
<body>
  <p>Planilla LUD se mudó a <a href="https://planilla-lud.vercel.app/">planilla-lud.vercel.app</a>.<br>Te llevamos ahí…</p>
</body>
</html>
